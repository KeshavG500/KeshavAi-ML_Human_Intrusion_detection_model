# ============================================================
# Training & Inference Configuration
# GPU: NVIDIA Quadro T2000 (4GB VRAM) — Optimized
# Task: Human Person Intrusion Detection ONLY (no vehicles)
# ============================================================

model:
  architecture: yolov8s            # yolov8s = best fit for 4GB VRAM
  pretrained: true
  pretrained_weights: yolov8s.pt
  num_classes: 1                   # person ONLY — no vehicle class
  class_names:
    - person
  input_size: 640
  device: cuda                     # Quadro T2000 CUDA

training:
  epochs: 80
  batch_size: 8                    # Safe for 4GB VRAM with 640px images
  workers: 4
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  patience: 20
  save_period: 10
  project: runs/train
  name: intrusion_yolov8s_person
  val_split: 0.15
  test_split: 0.05
  seed: 42

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  shear: 2.0
  perspective: 0.0001
  flipud: 0.1
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.1
  copy_paste: 0.2

preprocessing:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  resize_mode: letterbox
  normalize: true
  target_fps: 15

inference:
  conf_threshold: 0.50
  iou_threshold: 0.45
  max_detections: 50
  device: cuda
  half_precision: true             # FP16 — critical for 4GB VRAM
  onnx_providers:
    - CUDAExecutionProvider
    - CPUExecutionProvider

tracking:
  algorithm: bytetrack
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8
  frame_rate: 15
  min_box_area: 10

alert:
  cooldown_seconds: 10
  person_count_threshold: 2        # Multiple Intruders threshold
  confidence_minimum: 0.60
  save_thumbnails: true
  thumbnail_quality: 85

datasets:
  coco:
    url_train_images: http://images.cocodataset.org/zips/train2017.zip
    url_val_images:   http://images.cocodataset.org/zips/val2017.zip
    url_annotations:  http://images.cocodataset.org/annotations/annotations_trainval2017.zip
    person_class_id: 0             # COCO person class (0-indexed)
  mot17:
    base_url: https://motchallenge.net/data/MOT17.zip
  virat:
    info_url: https://viratdata.org/

logging:
  level: INFO
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  rotation: "50 MB"
  retention: "14 days"
  compression: gz
